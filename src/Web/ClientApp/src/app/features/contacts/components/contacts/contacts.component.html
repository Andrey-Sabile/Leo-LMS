<section class="px-6 py-8">
    <div class="mx-auto max-w-6xl space-y-6">
        <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-3xl font-semibold">Contacts</h1>
            </div>
        </header>
        <input type="search" class="input w-full" placeholder="search">

        <div class="grid grid-rows-2 md:grid-cols-2">
            <ul class="list">
                @for (student of students(); track student) {
                <li class="list-row items-center">
                    <div class="avatar avatar-placeholder">
                        <div class="bg-base-200 rounded-full w-10">
                            SS
                        </div>
                    </div>
                    <div>
                        {{student.firstName}} {{student.lastName}}
                    </div>
                </li>
                }
            </ul>

            <h1>Student Card Shell</h1>
        </div>
    </div>
