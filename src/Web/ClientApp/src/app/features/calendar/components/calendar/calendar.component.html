<section class="min-h-screen bg-slate-50 px-6 py-8">
  <div class="mx-auto max-w-6xl space-y-6">
    <header class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-semibold text-slate-900">Calendar</h1>
        <p class="mt-1 text-sm text-slate-500">
          Overview of upcoming classes, meetings, and reminders.
        </p>
      </div>

      <div class="flex items-center gap-2">
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          <span>Today</span>
        </button>

        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white shadow transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          <span>Add Event</span>
        </button>
      </div>
    </header>

    <app-calendar-week-view
      [weekStart]="weekStart"
      [events]="demoEvents"
    ></app-calendar-week-view>
  </div>
</section>
