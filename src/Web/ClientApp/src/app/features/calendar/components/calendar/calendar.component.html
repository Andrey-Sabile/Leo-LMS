<section class="px-6 py-8">
  <div class="mx-auto max-w-6xl space-y-6">
    <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-3xl font-semibold">Calendar</h1>
      </div>

      <div class="flex flex-wrap gap-2">
        <div class="dropdown dropdown-start">
          <button type="button" tabindex="0" role="button" class="btn">
            {{ viewModeLabel() }}
          </button>
          <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box shadow">
            <li>
              <button type="button" (click)="setViewMode('day')">Day</button>
            </li>
            <li>
              <button type="button" (click)="setViewMode('week')">Week</button>
            </li>
            <li>
              <button type="button" (click)="setViewMode('month')">Month</button>
            </li>
          </ul>
        </div>
        <button type="button" class="btn btn-primary">Add Event</button>
      </div>
    </header>

    @switch (viewMode()) {
    @case ('day') {
    <div class="alert alert-info">
      <span>Day view is under construction.</span>
    </div>
    }
    @case ('week') {
    <div class="rounded-box border border-base-200 bg-base-100 p-4">
      <app-calendar-week-view></app-calendar-week-view>
    </div>
    }
    @case ('month') {
    <div class="alert alert-info">
      <span>Month view is under construction.</span>
    </div>
    }
    }
  </div>
</section>
