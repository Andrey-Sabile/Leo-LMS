<div class="p-4 flex flex-col gap-4">
  <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <h1 class="text-3xl font-semibold">Calendar</h1>

    <div class="tabs tabs-box">
      @for (tab of viewTabs; track tab.mode) {
      <input type="radio" class="tab" name="view_mode_tabs" [ariaLabel]="tab.label"
        [class.tab-active]="viewMode() === tab.mode" (click)="setViewMode(tab.mode)">
      }
    </div>

    <div class="join">
      <button type="button" class="join-item btn bg-base-100" (click)="goToPreviousRange()">«</button>
      <button type="button" class="join-item btn bg-base-100" (click)="goToToday()">
        Today
      </button>
      <button type="button" class="join-item btn bg-base-100" (click)="goToNextRange()">»</button>
    </div>
  </header>

  <div class="card bg-base-100 card-border border-base-300 overflow-y-auto">
    <div class="card-body">
      @switch (viewMode()) {
      @case ('day') {

      <app-calendar-day-view [vm]="dayVm()" (eventDropped)="onEventDropped($event)"
        (timeSlotSelected)="onTimeSlotSelected($event)"></app-calendar-day-view>
      }
      @case ('week') {
      <app-calendar-week-view [vm]="weekVm()"></app-calendar-week-view>
      }
      @case ('month') {
      <app-calendar-month-view [vm]="monthVm()"></app-calendar-month-view>
      }
      }

    </div>
  </div>

</div>

<app-create-calendar-event-modal [open]="isCreateEventModalOpen()" [initialRange]="selectedCreateRange()"
  (eventCreated)="handleEventCreated($event)" (dismissed)="closeCreateEventModal()"></app-create-calendar-event-modal>
