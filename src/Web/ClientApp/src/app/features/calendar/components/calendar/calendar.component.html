<section class="">
  <div class="">
    <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-3xl font-semibold">Calendar</h1>
      </div>

      <div class="join">
        <button type="button" class="join-item btn bg-base-100" (click)="goToPreviousRange()">«</button>
        <button type="button" class="join-item btn bg-base-100" (click)="goToToday()">
          {{ currentRangeLabel() }}
        </button>
        <button type="button" class="join-item btn bg-base-100" (click)="goToNextRange()">»</button>
      </div>

      <div class="flex flex-wrap gap-2">
        <div class="dropdown dropdown-start">
          <button type="button" tabindex="0" role="button" class="btn bg-base-100">
            {{ viewModeLabel() }}
          </button>
          <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box shadow">
            <li>
              <button type="button" (click)="setViewMode('day')">Day</button>
            </li>
            <li>
              <button type="button" (click)="setViewMode('week')">Week</button>
            </li>
            <li>
              <button type="button" (click)="setViewMode('month')">Month</button>
            </li>
          </ul>
        </div>
        <button type="button" class="btn btn-primary" (click)="openCreateEventModal()">Add Event</button>
      </div>
    </header>

    <div class="rounded-box border border-base-200 bg-base-100 p-4">
      @switch (viewMode()) {
      @case ('day') {
      <app-calendar-day-view [vm]="dayVm()"></app-calendar-day-view>
      }
      @case ('week') {
      <app-calendar-week-view [vm]="weekVm()"></app-calendar-week-view>
      }
      @case ('month') {
      <app-calendar-month-view [vm]="monthVm()"></app-calendar-month-view>
      }
      }
    </div>

  </div>

  <app-create-calendar-event-modal [open]="isCreateEventModalOpen()" [initialRange]="currentDateRange()"
    (eventCreated)="handleEventCreated($event)" (dismissed)="closeCreateEventModal()"></app-create-calendar-event-modal>
</section>
