<div class="space-y-3">
  <!-- Header: Day labels -->
  <div class="grid grid-cols-1 gap-2 md:grid-cols-7">
    @for (day of vm().days; track day.date) {
      <div class="text-sm font-medium text-base-content/80 md:text-center">
        {{ day.label }}
      </div>
    }
  </div>

  <!-- Body: Day columns with events -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-7">
    @for (day of vm().days; track day.date) {
      <div class="rounded-box border border-base-200">
        <div class="divide-y divide-base-200">
          @if (day.events.length === 0) {
            <div class="p-3 text-sm text-base-content/60">No events</div>
          } @else {
            @for (evt of day.events; track evt.id) {
              <div class="p-3">
                <div class="text-xs text-base-content/60">{{ evt.timeLabel }}</div>
                <div class="font-medium">{{ evt.title }}</div>
              </div>
            }
          }
        </div>
      </div>
    }
  </div>
</div>
