<div class="card-body flex flex-col">
    <div class="grid grid-cols-7">
        @for (dayRange of dayRanges(); track dayRange.start; let id = $index) {
        <app-simple-calendar-day [dateRange]="dayRange"
            [calendarEvents]="calendarEventsByDay()[id]"></app-simple-calendar-day>
        }
    </div>
</div>
