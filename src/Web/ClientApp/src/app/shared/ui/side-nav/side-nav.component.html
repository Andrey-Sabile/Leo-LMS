<div class="drawer drawer-open">
  <input id="sidebar-drawer" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content flex flex-col bg-base-200">
    <div class="navbar bg-base-100">
      <div class="flex-1">
      </div>
      <div class="flex-none">
        <ul class="menu menu-horizontal px-1">
          <li>
            <details>
              <summary>References</summary>
              <ul class="bg-base-100 rounded-t-none p-2">
                <li routerLinkActive="active">
                  <a [routerLink]="['/counter']">Counter</a>
                </li>
                <li routerLinkActive="active">
                  <a [routerLink]="['/fetch-data']">Fetch data</a>
                </li>
                <li routerLinkActive="active">
                  <a [routerLink]="['/todo']">Todo</a>
                </li>
                <li>
                  <a href="/api" target="_blank" rel="noopener">API</a>
                </li>
                <li>
                  <a href="/Identity/Account/Manage">Account</a>
                </li>
              </ul>
            </details>
          </li>
        </ul>
      </div>
    </div>

    <ng-content></ng-content>
  </div>

  <div class="drawer-side is-drawer-close:overflow-visible">
    <label for="sidebar-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
    <div class="is-drawer-close:w-14 is-drawer-open:w-64 bg-base-100 flex flex-col min-h-full">
      <a class="btn btn-ghost text-xl font-semibold mt-4" [routerLink]="['/']">Leo</a>
      <ul class="menu w-full grow p-4 mt-6">
        @for (item of navLinks; track item.route) {
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.exact ?? false }">
          <a [routerLink]="item.route" class="rounded-lg">
            <span class="flex items-center gap-3">
              <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-base-100 text-base-content">
                <ng-icon [name]="item.iconPaths"></ng-icon>
              </span>
              <span class="font-medium">{{ item.label }}</span>
            </span>
          </a>
        </li>
        }
      </ul>
    </div>
  </div>
</div>
