        <button class="btn btn-ghost btn-square" type="button" aria-label="Toggle navigation"
          [attr.aria-expanded]="isExpanded" (click)="toggle()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <ul class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
          <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <a [routerLink]="['/']" (click)="collapse()">Home</a>
          </li>
          <li routerLinkActive="active">
            <a [routerLink]="['/counter']" (click)="collapse()">Counter</a>
          </li>
          <li routerLinkActive="active">
            <a [routerLink]="['/fetch-data']" (click)="collapse()">Fetch data</a>
          </li>
          <li routerLinkActive="active">
            <a [routerLink]="['/todo']" (click)="collapse()">Todo</a>
          </li>
          <li>
            <a href="/api" target="_blank" rel="noopener" (click)="collapse()">API</a>
          </li>
          <li>
            <a href="/Identity/Account/Manage" (click)="collapse()">Account</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="navbar-end hidden lg:flex">
      <ul class="menu menu-horizontal px-1 gap-2">
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <a [routerLink]="['/']">Home</a>
        </li>
        <li>
          <details>
            <summary>References</summary>
            <ul class="bg-base-100 rounded-t-none p-2">
              <li routerLinkActive="active">
                <a [routerLink]="['/counter']">Counter</a>
              </li>
              <li routerLinkActive="active">
                <a [routerLink]="['/fetch-data']">Fetch data</a>
              </li>
              <li routerLinkActive="active">
                <a [routerLink]="['/todo']">Todo</a>
              </li>
              <li>
                <a href="/api" target="_blank" rel="noopener">API</a>
              </li>
              <li>
                <a href="/Identity/Account/Manage">Account</a>
              </li>

            </ul>
          </details>
        </li>
      </ul>
    </div>
  </nav>
