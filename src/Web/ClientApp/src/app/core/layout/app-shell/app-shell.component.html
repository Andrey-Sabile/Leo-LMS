<div class="drawer drawer-open">
  <input id="sidebar-drawer" type="checkbox" class="drawer-toggle">

  <div class="drawer-content bg-base-200">
    <main class="container mx-auto px-6 py-8 flex flex-col">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div class="drawer-side">
    <label for="sidebar-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
    <div class="w-64 bg-base-100 flex flex-col gap-4 items-start min-h-full">

      <a class="btn btn-ghost text-lg font-semibold mt-4 self-center">Leo</a>

      <ul class="menu menu-lg w-full p-4 mt-6 grow">
        @for (item of navLinks; track item.route) {
        <li>
          <a [routerLink]="item.route" class="rounded-lg flex items-center gap-3">
            <ng-icon [name]="item.iconPaths"></ng-icon>
            <p class="">{{ item.label }}</p>
          </a>
        </li>
        }
      </ul>

      <div class="" data-tip="Open">
      </div>
    </div>
  </div>
</div>
